name: Collect news and events

on:
  schedule:
    - cron: "17 */3 * * *"
  push:
    paths:
      - docs/review.md
      - pipeline/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        working-directory: pipeline
        run: python -m unittest test_collect test_collect_events
      - name: Collect news
        run: python pipeline/collect.py
      - name: Collect events
        env:
          EVENTS_SHEET_URL: ${{ vars.EVENTS_SHEET_URL }}
        run: python pipeline/collect_events.py
      - name: Publish changes
        run: |
          git config user.name "nyocker-news"
          git config user.email "nyocker-news@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Update news and events"
          git push
